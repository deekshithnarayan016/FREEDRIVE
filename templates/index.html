<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FREEDRIVE</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; font-family: 'Poppins', sans-serif; }

body {
    margin: 0;
    min-height: 100vh;
    background: #f4f6fb;
}

header {
    background: linear-gradient(135deg, #667eea, #764ba2);
    padding: 25px 40px;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header button {
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
}

.container {
    max-width: 1000px;
    margin: 40px auto;
    padding: 0 20px;
}

/* NEW BUTTON */
.new-wrapper { position: relative; margin-bottom: 30px; }

.new-btn {
    background: white;
    border-radius: 999px;
    padding: 12px 22px;
    border: none;
    font-size: 16px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.2);
}

.new-menu {
    position: absolute;
    top: 60px;
    left: 0;
    width: 220px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    overflow: hidden;
    z-index: 1000;
}

.menu-item { padding: 14px 16px; cursor: pointer; }
.menu-item:hover { background: #f1f3f4; }
.hidden { display: none; }

.table-card {
    background: white;
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.08);
}

table { width: 100%; border-collapse: collapse; }
th { background: #f0f2ff; padding: 10px; }
td { padding: 10px; border-bottom: 1px solid #eee; }

.action-btn {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
}

.breadcrumb {
    margin-bottom: 15px;
    color: #555;
    cursor: pointer;
}
</style>
</head>

<body>

<header>
    <h2>FREEDRIVE</h2>
    <button onclick="logout()">Logout</button>
</header>

<div class="container">

<div class="breadcrumb" onclick="goRoot()">🏠 Root <span id="path"></span></div>

<div class="new-wrapper">
    <button class="new-btn" id="newBtn">+ New</button>
    <div class="new-menu hidden" id="newMenu">
        <div class="menu-item" onclick="createFolder()">📁 New folder</div>
        <div class="menu-item" onclick="fileInput.click()">⬆️ File upload</div>
        <div class="menu-item" onclick="folderInput.click()">⬆️ Folder upload</div>
    </div>

    <input type="file" id="fileInput" hidden onchange="uploadFile(this)">
    <input type="file" id="folderInput" hidden webkitdirectory multiple onchange="uploadFolder(this)">
</div>

<div class="table-card">
<h3>Your Files</h3>
<table>
<thead>
<tr><th>Name</th><th>Action</th></tr>
</thead>
<tbody id="fileTableBody"></tbody>
</table>
</div>

</div>

<script>
let currentPath = "";

const newBtn = document.getElementById("newBtn");
const newMenu = document.getElementById("newMenu");
const pathSpan = document.getElementById("path");

newBtn.onclick = e => {
    e.stopPropagation();
    newMenu.classList.toggle("hidden");
};

document.addEventListener("click", () => newMenu.classList.add("hidden"));

function logout() {
    window.location.href = "/logout";
}

function goRoot() {
    currentPath = "";
    loadFiles();
}

/* Upload file */
async function uploadFile(input) {
    const file = input.files[0];
    if (!file) return;

    const fd = new FormData();
    fd.append("file", file);
    if (currentPath) fd.append("path", `${currentPath}/${file.name}`);

    await fetch("/upload", { method: "POST", body: fd });
    input.value = "";
    loadFiles();
}

/* Upload folder */
async function uploadFolder(input) {
    for (let file of input.files) {
        const fd = new FormData();
        fd.append("file", file);
        fd.append("path", currentPath
            ? `${currentPath}/${file.webkitRelativePath}`
            : file.webkitRelativePath);

        await fetch("/upload", { method: "POST", body: fd });
    }
    input.value = "";
    loadFiles();
}

/* Create folder */
async function createFolder() {
    const name = prompt("Folder name");
    if (!name) return;

    const fd = new FormData();
    fd.append("file", new Blob([""], { type: "text/plain" }), ".keep");
    fd.append("path", currentPath
        ? `${currentPath}/${name}/.keep`
        : `${name}/.keep`);

    await fetch("/upload", { method: "POST", body: fd });
    loadFiles();
}

/* Load files & folders */
async function loadFiles() {
    const res = await fetch(`/files?path=${currentPath}`);
    const data = await res.json();

    pathSpan.textContent = currentPath ? " / " + currentPath : "";

    const table = document.getElementById("fileTableBody");
    table.innerHTML = "";

    data.folders.forEach(folder => {
        table.innerHTML += `
        <tr>
            <td style="cursor:pointer" onclick="openFolder('${folder}')">📁 ${folder}</td>
            <td>
                <button class="action-btn" onclick="downloadFolder('${folder}')">Download</button>
            </td>
        </tr>`;
    });

    data.files.forEach(file => {
        table.innerHTML += `
        <tr>
            <td>📄 ${file}</td>
            <td>
                <button class="action-btn" onclick="downloadFile('${file}')">Download</button>
            </td>
        </tr>`;
    });
}

function openFolder(folder) {
    currentPath = currentPath ? `${currentPath}/${folder}` : folder;
    loadFiles();
}

function downloadFile(file) {
    window.open(`/download?blob=${currentPath ? currentPath + "/" : ""}${file}`);
}

function downloadFolder(folder) {
    window.open(`/download-folder?folder=${currentPath ? currentPath + "/" : ""}${folder}`);
}

loadFiles();
</script>

</body>
</html>
