<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FREEDRIVE</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; font-family: 'Poppins', sans-serif; }

body { margin: 0; background: #f4f6fb; }

header {
    background: linear-gradient(135deg, #667eea, #764ba2);
    padding: 22px 40px;
    color: white;
    display: flex;
    justify-content: space-between;
}

header button {
    background: rgba(255,255,255,0.25);
    border: none;
    color: white;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
}

.container {
    max-width: 1000px;
    margin: 40px auto;
}

/* Breadcrumb */
.breadcrumb {
    margin-bottom: 15px;
    color: #555;
    cursor: pointer;
}

/* New button */
.new-wrapper { position: relative; margin-bottom: 25px; }

.new-btn {
    background: white;
    border-radius: 999px;
    padding: 12px 22px;
    border: none;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,0.15);
}

.new-menu {
    position: absolute;
    top: 55px;
    left: 0;
    width: 220px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    overflow: hidden;
    z-index: 1000;
}

.menu-item {
    padding: 14px 16px;
    cursor: pointer;
}
.menu-item:hover { background: #f1f3f4; }
.hidden { display: none; }

/* Table */
.table-card {
    background: white;
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.08);
}

table { width: 100%; border-collapse: collapse; }
th { background: #f0f2ff; padding: 10px; }
td { padding: 10px; border-bottom: 1px solid #eee; }

.action-btn {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    margin-right: 6px;
}

.delete-btn {
    background: #e74c3c;
}
</style>
</head>

<body>

<header>
    <h2>MYDRIVE</h2>
    <button onclick="logout()">Logout</button>
</header>

<div class="container">

<div class="breadcrumb" onclick="goRoot()">🏠 Home <span id="path"></span></div>

<div class="new-wrapper">
    <button class="new-btn" id="newBtn">+ New</button>

    <div class="new-menu hidden" id="newMenu">
        <div class="menu-item" onclick="createFolder()">📁 New folder</div>
        <div class="menu-item" onclick="fileInput.click()">⬆️ File upload</div>
        <div class="menu-item" onclick="folderInput.click()">⬆️ Folder upload</div>
    </div>

    <input type="file" id="fileInput" hidden>
    <input type="file" id="folderInput" hidden webkitdirectory multiple>
</div>

<div class="table-card">
<h3>Your Drive</h3>
<table>
<thead>
<tr><th>Name</th><th>Action</th></tr>
</thead>
<tbody id="fileTableBody"></tbody>
</table>
</div>

</div>

<script>
let currentPath = "";

const newBtn = document.getElementById("newBtn");
const newMenu = document.getElementById("newMenu");
const fileInput = document.getElementById("fileInput");
const folderInput = document.getElementById("folderInput");
const pathSpan = document.getElementById("path");

newBtn.onclick = e => {
    e.stopPropagation();
    newMenu.classList.toggle("hidden");
};

document.addEventListener("click", () => newMenu.classList.add("hidden"));

function logout() {
    window.location.href = "/logout";
}

function goRoot() {
    currentPath = "";
    loadFiles();
}

/* ---------- FILE UPLOAD ---------- */
fileInput.onchange = async () => {
    const file = fileInput.files[0];
    if (!file) return;

    const fd = new FormData();
    fd.append("file", file);

    if (currentPath) {
        fd.append("path", `${currentPath}/${file.name}`);
    }

    await fetch("/upload", { method: "POST", body: fd });
    fileInput.value = "";
    loadFiles();
};

/* ---------- FOLDER UPLOAD ---------- */
folderInput.onchange = async () => {
    for (const file of folderInput.files) {
        const fd = new FormData();
        fd.append("file", file);

        const fullPath = currentPath
            ? `${currentPath}/${file.webkitRelativePath}`
            : file.webkitRelativePath;

        fd.append("path", fullPath);
        await fetch("/upload", { method: "POST", body: fd });
    }

    folderInput.value = "";
    loadFiles();
};

/* ---------- CREATE FOLDER ---------- */
async function createFolder() {
    const name = prompt("Folder name");
    if (!name) return;

    const fd = new FormData();
    const keepFile = new File([""], ".keep", { type: "text/plain" });
    fd.append("file", keepFile);

    const path = currentPath
        ? `${currentPath}/${name}/.keep`
        : `${name}/.keep`;

    fd.append("path", path);

    await fetch("/upload", { method: "POST", body: fd });
    loadFiles();
}


/* ---------- LOAD FILES ---------- */
async function loadFiles() {
    const res = await fetch(`/files?path=${encodeURIComponent(currentPath)}`);
    const data = await res.json();

    pathSpan.textContent = currentPath ? " / " + currentPath : "";

    const table = document.getElementById("fileTableBody");
    table.innerHTML = "";

    // FOLDERS
    data.folders.forEach(folder => {
        table.innerHTML += `
        <tr>
            <td style="cursor:pointer" onclick="openFolder('${folder}')">
                📁 ${folder}
            </td>
            <td>
                <button class="action-btn" onclick="downloadFolder('${folder}')">Download</button>
                <button class="action-btn delete-btn" onclick="deleteFolder('${folder}')">Delete</button>
            </td>
        </tr>`;
    });

    // FILES
    data.files.forEach(file => {
        table.innerHTML += `
        <tr>
            <td>📄 ${file}</td>
            <td>
                <button class="action-btn" onclick="downloadFile('${file}')">Download</button>
                <button class="action-btn delete-btn" onclick="deleteFile('${file}')">Delete</button>
            </td>
        </tr>`;
    });
}


function openFolder(folder) {
    currentPath = currentPath ? `${currentPath}/${folder}` : folder;
    loadFiles();
}

async function downloadFile(file) {
    const path = currentPath ? `${currentPath}/${file}` : file;

    const res = await fetch(`/download?blob=${encodeURIComponent(path)}`);
    const data = await res.json();

    if (data.url) {
        window.open(data.url);
    } else {
        alert("Download failed");
    }
}

function downloadFolder(folder) {
    const path = currentPath ? `${currentPath}/${folder}` : folder;
    window.open(`/download-folder?path=${encodeURIComponent(path)}`);
}

/* ---------- DELETE FILE ---------- */
async function deleteFile(file) {
    if (!confirm("Delete this file permanently?")) return;

    const path = currentPath ? `${currentPath}/${file}` : file;

    const res = await fetch("/delete-file", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ blob: path })
    });

    const data = await res.json();
    if (data.success) loadFiles();
    else alert("Delete failed");
}

/* ---------- DELETE FOLDER ---------- */
async function deleteFolder(folder) {
    if (!confirm("Delete this folder and all files inside?")) return;

    const path = currentPath ? `${currentPath}/${folder}` : folder;

    const res = await fetch("/delete-folder", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path })
    });

    const data = await res.json();
    if (data.success) loadFiles();
    else alert("Delete failed");
}

loadFiles();
</script>

</body>
</html>
