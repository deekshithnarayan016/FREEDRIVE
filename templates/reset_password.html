<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FREEDRIVE | Reset Password</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

.title {
    color: white;
    font-size: 30px;
    font-weight: 700;
    margin-bottom: 25px;
    animation: fadeDown 0.8s ease;
}

@keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to   { opacity: 1; transform: translateY(0); }
}

.reset-box {
    background: white;
    width: 360px;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
}

.reset-box h2 {
    text-align: center;
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 10px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 10px;
    margin-top: 15px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    font-size: 15px;
    cursor: pointer;
}

.note {
    font-size: 13px;
    color: #666;
    text-align: center;
    margin-top: 10px;
}
</style>
</head>

<body>

<h1 class="title">MY DRIVE</h1>

<div class="reset-box">
    <h2>Reset Password</h2>

    <form method="POST">
        <input type="password" name="password" placeholder="New password" required>
        <input type="password" id="confirm" placeholder="Confirm password" required>

        <button type="submit" onclick="return validate()">Update Password</button>
    </form>

    <div class="note">
        Please choose a strong password.
    </div>
</div>

<script>
function validate() {
    const pass = document.querySelector('input[name="password"]').value;
    const confirm = document.getElementById("confirm").value;

    if (pass !== confirm) {
        alert("Passwords do not match");
        return false;
    }
    return true;
}
</script>

</body>
</html>
