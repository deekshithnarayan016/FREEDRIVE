<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FREEDRIVE | Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

.welcome-title {
    color: white;
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 25px;
    animation: fadeDown 0.8s ease;
}

@keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to   { opacity: 1; transform: translateY(0); }
}

.auth-box {
    background: white;
    width: 360px;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
}

.auth-box h2 {
    text-align: center;
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 10px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 10px;
    margin-top: 15px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    font-size: 15px;
    cursor: pointer;
}

.toggle {
    text-align: center;
    margin-top: 15px;
    font-size: 14px;
}

.toggle span {
    color: #667eea;
    cursor: pointer;
    font-weight: 500;
}

.forgot {
    text-align: right;
    font-size: 13px;
    margin-top: 6px;
}

.forgot span {
    color: #667eea;
    cursor: pointer;
}
</style>
</head>

<body>

<h1 class="welcome-title">MY DRIVE</h1>

<div class="auth-box">
    <h2 id="title">Login</h2>

    <form id="authForm">
        <!-- EMAIL instead of username -->
        <input type="email" id="email" placeholder="Email address" required>
        <input type="password" id="password" placeholder="Password" required>

        <div class="forgot">
            <span onclick="forgotPassword()">Forgot password?</span>
        </div>

        <button type="submit" id="submitBtn">Login</button>
    </form>

    <div class="toggle">
        <p id="toggleText">
            Don’t have an account?
            <span onclick="toggleMode()">Sign up</span>
        </p>
    </div>
</div>

<script>
let isLogin = true;

function toggleMode() {
    isLogin = !isLogin;

    document.getElementById("title").innerText = isLogin ? "Login" : "Sign Up";
    document.getElementById("submitBtn").innerText = isLogin ? "Login" : "Sign Up";
    document.getElementById("toggleText").innerHTML =
        isLogin
        ? `Don’t have an account? <span onclick="toggleMode()">Sign up</span>`
        : `Already have an account? <span onclick="toggleMode()">Login</span>`;
}

document.getElementById("authForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const endpoint = isLogin ? "/login" : "/signup";

    const response = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: email, password })
    });

    const data = await response.json();

    if (data.success) {
        window.location.href = "/dashboard";
    } else {
        alert(data.error || "Authentication failed");
    }
});

/* -------- FORGOT PASSWORD -------- */
async function forgotPassword() {
    const email = document.getElementById("email").value.trim();

    if (!email) {
        alert("Please enter your email first");
        return;
    }

    const res = await fetch("/forgot-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email })
    });

    const data = await res.json();
    alert(data.message || "If this email exists, a reset link was sent.");
}
</script>

</body>
</html>
